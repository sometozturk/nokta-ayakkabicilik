name: Deploy storefront to GitHub Pages

on:
  push:
    branches:
      - main
  # Shopier senkronu ürün değiştirdiğinde bu iş oradan tetiklenir (sync-shopier.yml).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # products.json'dan kategori/ürün sayfalarını ve sitemap.xml'i üretir (bağımlılık yok).
      - name: Build SEO pages
        run: node scripts/build-seo.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload storefront
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy storefront
        id: deployment
        uses: actions/deploy-pages@v4
