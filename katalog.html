<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nokta Ayakkabıcılık koleksiyonundaki 90 modeli inceleyin.">
    <meta name="theme-color" content="#0d0d0d">
    <title>Nokta Katalog | Tüm Modeller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.shopier.app">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
    <style>
        :root{color-scheme:dark;--bg:#0d0d0d;--card:#151515;--text:#f5efe4;--muted:#a9a096;--accent:#e34b35;--border:#2a2a2a;}
        *{box-sizing:border-box;}
        body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
        a{color:inherit;}
        .header{padding:30px 20px;border-bottom:1px solid var(--border);background:#000;}
        .header-inner{width:min(1400px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;}
        .brand{font-family:'Fraunces',serif;font-size:20px;text-decoration:none;letter-spacing:.04em;}
        .back-link{color:var(--muted);font-size:13px;text-decoration:none;}
        .back-link:hover{color:var(--accent);}
        main{width:min(1560px,calc(100% - 40px));margin:0 auto;padding:52px 0 72px;}
        .catalog-layout{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start;gap:36px;}
        .sidebar{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;padding:20px;border:1px solid var(--border);border-radius:7px;background:var(--card);scrollbar-color:#555 transparent;}
        .brand-nav,.series-nav{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;}
        .category-group{padding:11px 0;border-top:1px solid var(--border);}
        .brand-nav{padding:2px 0 7px;border:0;background:none;color:#fff;font-size:14px;font-weight:700;}
        .brand-nav:hover,.brand-nav[aria-pressed="true"]{color:var(--accent);}
        .series-nav{padding:5px 0 5px 11px;border:0;border-left:2px solid transparent;background:none;color:var(--muted);font-size:12px;line-height:1.4;}
        .series-nav:hover,.series-nav[aria-pressed="true"]{border-left-color:var(--accent);color:var(--accent);}
        .catalog-content{min-width:0;}
        .catalog-category{margin:0 0 36px;scroll-margin-top:24px;}
        .catalog-category:last-child{margin-bottom:0;}
        .category-title{margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid var(--border);font-family:'Fraunces',serif;font-size:23px;font-weight:400;}
        .brand-title{font-weight:600;}
        .series-title{margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid var(--border);font-family:'Fraunces',serif;font-size:20px;font-weight:300;}
        .intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px;}
        h1{margin:0 0 8px;font-family:'Fraunces',serif;font-size:clamp(34px,5vw,52px);font-weight:400;}
        .intro p{margin:0;color:var(--muted);font-size:14px;}
        .count{flex:0 0 auto;color:var(--muted);font-size:14px;}
        .count strong{color:var(--text);}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}
        .card{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:7px;background:var(--card);transition:transform .2s ease,border-color .2s ease;}
        .card:hover{transform:translateY(-4px);border-color:#555;}
        .card[hidden]{display:none;}
        .card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#fff;}
        .card-info{display:flex;flex:1;flex-direction:column;padding:16px;}
        .card-title{margin:0 0 8px;color:#fff;font-size:14px;line-height:1.5;}
        .card-code{margin-bottom:8px;color:var(--muted);font-size:11px;}
        .card-price{margin-top:auto;padding:4px 0 14px;color:var(--accent);font-family:'Fraunces',serif;font-size:19px;}
        .card-btn{display:block;padding:11px;text-align:center;border-radius:4px;background:#fff;color:#000;font-size:12px;font-weight:700;letter-spacing:.06em;text-decoration:none;}
        .card-btn:hover{background:var(--accent);color:#fff;}
        .status{padding:50px 20px;text-align:center;color:var(--muted);}
        .status[hidden]{display:none;}
        @media(max-width:800px){
            .catalog-layout{grid-template-columns:1fr;gap:24px;}
            .sidebar{position:static;max-height:340px;}
        }
        @media(max-width:640px){
            .header{padding:20px 14px;}
            main{width:calc(100% - 28px);padding:36px 0 52px;}
            .intro{align-items:start;flex-direction:column;gap:10px;}
            .toolbar{flex-direction:column;}
            .brand-filter{width:100%;}
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
            .card-info{padding:12px;}
            .card-title{font-size:13px;}
            .card-price{font-size:17px;}
        }
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;}}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a class="brand" href="index.html">NOKTA KOLEKSİYON</a>
            <a class="back-link" href="index.html#iletisim">İletişim bölümüne dön</a>
        </div>
    </header>
    <main>
        <div class="catalog-layout">
            <aside class="sidebar" aria-label="Marka ve model kategorileri">
                <nav id="category-nav"></nav>
            </aside>
            <section class="catalog-content" aria-labelledby="catalog-title">
                <div class="intro">
                    <div>
                        <h1 id="catalog-title">Koleksiyon</h1>
                        <p>Koleksiyondaki modelleri inceleyin ve Shopier'den güvenle satın alın.</p>
                    </div>
                    <div class="count" id="product-count" aria-live="polite">Modeller yükleniyor...</div>
                </div>
                <div id="catalog-sections"></div>
                <p class="status" id="catalog-status" role="status">Modeller yükleniyor...</p>
            </section>
        </div>
    </main>
    <script>
        (() => {
            const count = document.getElementById('product-count');
            const status = document.getElementById('catalog-status');
            const categoryNav = document.getElementById('category-nav');
            const catalogSections = document.getElementById('catalog-sections');
            const brandNames = ['Nike', 'Adidas', 'Alexander Mcqueen', 'Calvin Klein', 'Goldengoose', 'Lacoste', 'Lufian', 'Prada', 'Vans'];
            const getBrand = (title, category = '') => {
                const lowerTitle = title.toLocaleLowerCase('tr-TR');
                if (category === 'Çocuk Sneakers' || /^Lacoste\s+White-Purple\b/i.test(title)) return 'Çocuk Sneakers';
                const brand = brandNames.find(name => lowerTitle.startsWith(name.toLocaleLowerCase('tr-TR')));
                return brand || (category === 'Çocuk Sneakers' ? category : title.split(' ')[0]);
            };
            const getSeries = (title, brand) => {
                if (brand === 'Çocuk Sneakers' || brand === 'Alexander Mcqueen' || brand === 'Calvin Klein' || brand === 'Goldengoose' || brand === 'Lufian') return '';
                const actualBrand = brandNames.find(name => title.toLocaleLowerCase('tr-TR').startsWith(name.toLocaleLowerCase('tr-TR')));
                const model = title.slice(actualBrand ? actualBrand.length : 0).trim().replace(/\s*\([^)]*\)/g, '').replace(/\s*Çocuk(?:\s+Sneaker)?/gi, '').trim();
                const rules = {
                    'Nike': [
                        [/^Air\s*force/i, 'Air Force'],
                        [/^Dunk/i, 'Dunk'],
                        [/^(?:Air\s*)?Jordan/i, 'Jordan'],
                        [/^Cherry/i, 'Cherry'],
                        [/^Court/i, 'Court'],
                        [/^P[\s-]*6000/i, 'P-6000'],
                        [/^Initiator/i, 'Initiator'],
                        [/^(?:Air\s*)?Zoom/i, 'Zoom'],
                        [/^Zoom/i, 'Zoom'],
                        [/^Air(?:270|\s)/i, 'Air'],
                        [/^TN\b/i, 'TN'],
                        [/Ortopedik/i, 'Ortopedik'],
                        [/^530/i, '530'],
                        [/^Black\s+Full/i, 'Ortopedik'],
                        [/^Black-White/i, 'Ortopedik']
                    ],
                    'Çocuk Sneakers': [
                        [/^Işıklı/i, 'Işıklı'],
                        [/^Ortopedik/i, 'Ortopedik']
                    ],
                    'Adidas': [
                        [/^Spezial/i, 'Spezial'],
                        [/^(?:Süperstar|Superstar)/i, 'Superstar'],
                        [/^Campus/i, 'Campus'],
                        [/^Samba/i, 'Samba'],
                        [/^Neo\s+Entrap/i, 'Entrap'],
                        [/^Entrap/i, 'Entrap'],
                        [/^Duramo/i, 'Duramo'],
                        [/^Terrex/i, 'Terrex']
                    ],
                    'Calvin Klein': [
                        [/^Black-White/i, 'Black-White'],
                        [/^White-Black/i, 'White-Black'],
                        [/^White-Gray/i, 'White-Gray']
                    ],
                    'Lacoste': [
                        [/^(?:Black-White|Full)/i, 'Classic'],
                        [/^Elite/i, 'Elite Active']
                    ],
                    'Lufian': [
                        [/^Siyah-Beyaz/i, 'Siyah-Beyaz'],
                        [/^White/i, 'White']
                    ],
                    'Prada': [
                        [/^Elite/i, 'Elite'],
                        [/^High\s+Taban/i, 'High Taban']
                    ],
                    'Vans': [
                        [/^Knu\s+Skool/i, 'Knu Skool'],
                        [/^Classic/i, 'Classic'],
                        [/^Hyl(?:ine|ane)/i, 'Hyline']
                    ]
                };
                const match = (rules[brand] || []).find(([pattern]) => pattern.test(model));
                return match ? match[1] : 'Diğer modeller';
            };
            const formatPrice = price => {
                const value = Number(String(price).replace(',', '.'));
                return Number.isFinite(value) && value > 0 ? `${value.toLocaleString('tr-TR')} ₺` : 'Fiyat bilgisi için Shopier';
            };
            const showError = message => {
                count.textContent = 'Modeller yüklenemedi';
                status.textContent = message;
                status.hidden = false;
            };

            fetch('products.json', { cache: 'no-store' })
                .then(response => {
                    if (!response.ok) throw new Error(`Ürün verisi alınamadı (${response.status}).`);
                    return response.json();
                })
                .then(products => {
                    if (!Array.isArray(products) || products.length !== 90) {
                        throw new Error(`Katalogda 90 model bekleniyordu; ${Array.isArray(products) ? products.length : 0} model bulundu.`);
                    }
                    const validProducts = products.filter(product => product && product.title && product.image && product.url);
                    if (validProducts.length !== 90) {
                        throw new Error(`90 model gösterilemedi; gerekli ürün bilgileri eksik olan ${90 - validProducts.length} kayıt var.`);
                    }

                    const brandOrder = ['Nike', 'Adidas', 'Vans', 'Alexander Mcqueen', 'Goldengoose', 'Lacoste'];
                    const brands = [...new Set(validProducts.map(product => getBrand(product.title, product.category)))]
                        .sort((a, b) => {
                            const aIndex = brandOrder.indexOf(a);
                            const bIndex = brandOrder.indexOf(b);
                            if (aIndex !== -1 || bIndex !== -1) {
                                if (aIndex === -1) return 1;
                                if (bIndex === -1) return -1;
                                return aIndex - bIndex;
                            }
                            if (a === 'Çocuk Sneakers') return 1;
                            if (b === 'Çocuk Sneakers') return -1;
                            return a.localeCompare(b, 'tr');
                        });
                    const categories = [];
                    brands.forEach(brand => {
                        const brandProducts = validProducts.filter(product => getBrand(product.title, product.category) === brand);
                        const series = [...new Set(brandProducts
                            .map(product => getSeries(product.title, brand))
                            .filter(Boolean))]
                            .sort((a, b) => a.localeCompare(b, 'tr'));
                        if (!series.length) series.push('');

                        const group = document.createElement('div');
                        group.className = 'category-group';
                        group.dataset.brand = brand;
                        const brandButton = document.createElement('button');
                        brandButton.className = 'brand-nav';
                        brandButton.type = 'button';
                        brandButton.textContent = brand;
                        brandButton.dataset.categoryId = '';
                        brandButton.setAttribute('aria-pressed', 'false');
                        group.append(brandButton);

                        series.forEach((name, seriesIndex) => {
                            const categoryProducts = name
                                ? brandProducts.filter(product => getSeries(product.title, brand) === name)
                                : brandProducts;
                            const sectionId = `catalog-category-${categories.length}`;
                            const section = document.createElement('section');
                            section.className = 'catalog-category';
                            section.id = sectionId;
                            section.dataset.categoryId = sectionId;
                            section.dataset.brand = brand;
                            section.dataset.series = name;

                            if (seriesIndex === 0) {
                                const brandHeading = document.createElement('h2');
                                brandHeading.className = 'category-title brand-title';
                                brandHeading.textContent = brand;
                                section.append(brandHeading);
                            }
                            if (name) {
                                const seriesHeading = document.createElement('h3');
                                seriesHeading.className = 'series-title';
                                seriesHeading.textContent = name;
                                section.append(seriesHeading);
                            }

                            const grid = document.createElement('div');
                            grid.className = 'grid';
                            categoryProducts.forEach((product, index) => {
                                const card = document.createElement('article');
                                card.className = 'card';
                                const image = document.createElement('img');
                                image.src = product.image;
                                image.alt = product.title;
                                image.loading = categories.length === 0 && index < 4 ? 'eager' : 'lazy';
                                image.decoding = 'async';

                                const info = document.createElement('div');
                                info.className = 'card-info';
                                const title = document.createElement('h3');
                                title.className = 'card-title';
                                title.textContent = product.title;
                                const code = document.createElement('div');
                                code.className = 'card-code';
                                code.textContent = `Model ${String(product.id || index + 1).padStart(2, '0')}`;
                                const price = document.createElement('div');
                                price.className = 'card-price';
                                price.textContent = formatPrice(product.price);
                                const link = document.createElement('a');
                                link.className = 'card-btn';
                                link.href = product.url;
                                link.target = '_blank';
                                link.rel = 'noopener noreferrer';
                                link.textContent = "SHOPIER'DE GÖR";

                                info.append(title, code, price, link);
                                card.append(image, info);
                                grid.append(card);
                            });
                            section.append(grid);
                            catalogSections.append(section);
                            categories.push({ brand, series: name, id: sectionId });

                            if (series.length > 1) {
                                const seriesButton = document.createElement('button');
                                seriesButton.className = 'series-nav';
                                seriesButton.type = 'button';
                                seriesButton.textContent = name;
                                seriesButton.dataset.categoryId = sectionId;
                                seriesButton.setAttribute('aria-pressed', 'false');
                                seriesButton.addEventListener('click', () => section.scrollIntoView({ behavior: 'smooth', block: 'start' }));
                                group.append(seriesButton);
                            } else {
                                brandButton.dataset.categoryId = sectionId;
                                brandButton.addEventListener('click', () => section.scrollIntoView({ behavior: 'smooth', block: 'start' }));
                            }
                        });
                        if (series.length > 1) {
                            brandButton.dataset.categoryId = categories[categories.length - series.length].id;
                            brandButton.addEventListener('click', () => document.getElementById(brandButton.dataset.categoryId).scrollIntoView({ behavior: 'smooth', block: 'start' }));
                        }
                        categoryNav.append(group);
                    });

                    count.textContent = `${validProducts.length} model`;
                    status.hidden = true;
                    const updateActiveCategory = () => {
                        const threshold = window.innerHeight * 0.35;
                        const sections = [...catalogSections.querySelectorAll('.catalog-category')];
                        const current = sections.filter(section => section.getBoundingClientRect().top <= threshold).pop() || sections[0];
                        if (!current) return;
                        categoryNav.querySelectorAll('button').forEach(button => {
                            const isBrand = button.classList.contains('brand-nav');
                            const active = isBrand
                                ? button.closest('.category-group').dataset.brand === current.dataset.brand
                                : button.dataset.categoryId === current.id;
                            button.setAttribute('aria-pressed', String(active));
                        });
                        const activeLink = categoryNav.querySelector('button[aria-pressed="true"]');
                        if (activeLink) {
                            const sidebar = document.querySelector('.sidebar');
                            const linkBounds = activeLink.getBoundingClientRect();
                            const sidebarBounds = sidebar.getBoundingClientRect();
                            if (linkBounds.top < sidebarBounds.top || linkBounds.bottom > sidebarBounds.bottom) {
                                sidebar.scrollTo({
                                    top: sidebar.scrollTop + linkBounds.top - sidebarBounds.top - (sidebar.clientHeight - linkBounds.height) / 2,
                                    behavior: 'smooth'
                                });
                            }
                        }
                    };

                    let scrollFrame = 0;
                    window.addEventListener('scroll', () => {
                        if (scrollFrame) return;
                        scrollFrame = window.requestAnimationFrame(() => {
                            scrollFrame = 0;
                            updateActiveCategory();
                        });
                    }, { passive: true });
                    updateActiveCategory();
                })
                .catch(error => {
                    console.error('[Katalog] Modeller yüklenemedi:', error);
                    showError(error.message || 'Katalog yüklenirken beklenmeyen bir hata oluştu.');
                });
        })();
    </script>
</body>
</html>
