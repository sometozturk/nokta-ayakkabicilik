name: Sync Shopier products

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure runner Chrome
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Using Chrome at $CHROME_PATH"

      - name: Sync Shopier catalog
        run: node sync_shopier.js

      # Kategori/ürün sayfalarını ve sitemap.xml'i güncel ürünlerle yeniden üretir.
      - name: Rebuild SEO pages
        run: node scripts/build-seo.mjs

      - name: Commit catalog changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A products.json shopier-urls.json sitemap.xml kategori urun
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync Shopier catalog"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git push

      # Bot'un push'u (GITHUB_TOKEN) özel yayın iş akışını kendiliğinden başlatmaz;
      # Pages kaynağı "GitHub Actions" olsa bile yeni ürünler bu adımla yayına çıkar.
      - name: Publish updated catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
