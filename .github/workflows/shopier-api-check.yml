name: Shopier API check

# Shopier API bağlantısını dener. Kayıtlara ürün verisi yazılmaz; sadece sayılar ve alan adları.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Shopier API
        env:
          SHOPIER_PAT: ${{ secrets.SHOPIER_PAT }}
        run: node scripts/sync-shopier-api.mjs --check
