name: Sync Shopier products

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Resmi Shopier API'si (mağaza sayfalarını taramak Cloudflare'e takılıyordu).
      # API hata verirse iş başarısız olur; eski verilerle sessizce devam etmez.
      - name: Sync Shopier catalog (API)
        env:
          SHOPIER_PAT: ${{ secrets.SHOPIER_PAT }}
        run: node scripts/sync-shopier-api.mjs

      # Sepet kapak fotoğrafı için yeni ürünlerin kare parçaları (assets/tiles). Hata verirse senkron yine devam eder.
      - name: Build collage tiles
        continue-on-error: true
        run: |
          mkdir -p /tmp/sharp && (cd /tmp/sharp && npm init -y >/dev/null && npm i sharp --silent)
          ln -sfn /tmp/sharp/node_modules scripts/node_modules
          node scripts/build-tiles.mjs
          rm -f scripts/node_modules

      # Kategori/ürün sayfalarını ve sitemap.xml'i güncel ürünlerle yeniden üretir.
      - name: Rebuild SEO pages
        run: node scripts/build-seo.mjs

      - name: Commit catalog changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A products.json shopier-urls.json sitemap.xml index.html merchant-feed.xml kategori urun assets/tiles
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync Shopier catalog"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git push

      # Bot'un push'u (GITHUB_TOKEN) özel yayın iş akışını kendiliğinden başlatmaz;
      # Pages kaynağı "GitHub Actions" olsa bile yeni ürünler bu adımla yayına çıkar.
      - name: Publish updated catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
