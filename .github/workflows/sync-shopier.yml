name: Sync Shopier products

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Configure Chrome executable path
        run: |
          CHROME_PATH=$(find "$HOME/.cache/puppeteer" -type f -path '*/chrome-linux64/chrome' | head -n 1)
          test -n "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Using Chrome at $CHROME_PATH"

      - name: Sync Shopier catalog
        run: node sync_shopier.js

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json shopier-urls.json
          git diff --cached --quiet || git commit -m "chore: sync Shopier catalog"
          git push
